# includeAndroidResources (app/build.gradle testOptions) makes Robolectric load the real manifest. Two things keep the older tests as they were:
# LEGACY sqlite avoids a native SIGBUS in librobolectric-nativeruntime (Room tests), and a plain Application avoids RApplication
# running in every test. A test that needs the real one (ActHomeSoftKeyboardFocusHookTest) asks for it with @Config(application = ...).
sqliteMode=LEGACY
application=android.app.Application
