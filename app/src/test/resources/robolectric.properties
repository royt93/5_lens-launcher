# FISH-EXPORT: Robolectric 4.11.1's shadows only go up to API 34 (UpsideDownCake); this app's
# targetSdkVersion is 37. Only surfaces as a hard error once a test actually needs the real
# manifest/resources (includeAndroidResources=true in app/build.gradle, added alongside this
# file) - no prior test hit it. Pin every Robolectric test in this module to run against API 34
# shadows instead of failing to configure; this does not change what compileSdk/targetSdk the
# real app builds/ships against, only which Android version Robolectric emulates in the JVM.
sdk=34
