// ============================================================================
// PLUGINS
// ============================================================================
apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
// Firebase plugins - bật khi cần sử dụng Firebase
//apply plugin: 'com.google.gms.google-services'
//apply plugin: 'com.google.firebase.crashlytics'

// ============================================================================
// ANDROID CONFIGURATION
// ============================================================================
android {
    namespace 'com.mckimquyen'

    // SDK Versions - Android 14 (API 36)
    compileSdkVersion 36

    defaultConfig {
        applicationId "com.mckimquyen.lenslauncher"
        minSdkVersion 25    // Android 7.1 (Nougat)
        //noinspection EditedTargetSdkVersion
        targetSdkVersion 36 // Android 14

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Version format: YYYYMMDD
        versionCode 20260608
        versionName "2026.06.08"

        // ====================================================================
        // SIZE OPTIMIZATION - Giảm kích thước APK/AAB
        // ====================================================================

        // NOTE: Không dùng ndk.abiFilters ở đây vì conflict với splits.abi
        // ABI filtering được xử lý bởi splits.abi (xem bên dưới)

        // Vector drawable support cho API < 21
        vectorDrawables.useSupportLibrary = true

        // Chỉ giữ ngôn ngữ tiếng Anh và tiếng Việt
        // Loại bỏ resources của các ngôn ngữ khác (giảm ~1-2 MB)
//        resourceConfigurations += ['en', 'vi']
    }

    // ========================================================================
    // SIGNING CONFIGURATION
    // ========================================================================
    signingConfigs {
        release {
            storeFile file("keystore.jks")
            storePassword KS_PW
            keyAlias KS_ALIAS
            keyPassword KS_PW
        }
    }

    // ========================================================================
    // BUILD TYPES (Debug vs Release)
    // ========================================================================
    buildTypes {
        release {
            buildConfigField "Boolean", "IS_ENABLE_ADMOB", "false"
            // AppLovin SDK Key injected via manifestPlaceholders (không hardcode trong Manifest)
            manifestPlaceholders = [APPLOVIN_SDK_KEY: "e75FnQfS9XTTqM1Kne69U7PW_MBgAnGQTFvtwVVui6kRPKs5L7ws9twr5IQWwVfzPKZ5pF2IfDa7lguMgGlCyt"]
            buildConfigField "String", "PRIVACY_POLICY_URL", "\"https://loitp.notion.site/Term-Privacy-Policy-Disclaimer-319b1cd8783942fa8923d2a3c9bce60f\""

            buildConfigField "String", "APPLOVIN_BANNER_ID", "\"aa291bda0fb0b6c5\""
            buildConfigField "String", "APPLOVIN_INTERSTITIAL_ID", "\"7cf8ffccbdb242be\""
            buildConfigField "String", "APPLOVIN_APP_OPEN_ID", "\"d4acd020c861e87a\""
            buildConfigField "String", "APPLOVIN_REWARDED_ID", "\"6a333043c24bd06e\""

            // Release config - sử dụng AdMob IDs thật
            buildConfigField "String", "ADMOB_BANNER_ID", "\"ca-app-pub-3612191981543807/9970850592\""
            buildConfigField "String", "ADMOB_INTERSTITIAL_ID", "\"ca-app-pub-3612191981543807/2896523398\""
            buildConfigField "String", "ADMOB_APP_OPEN_ID", "\"ca-app-pub-3612191981543807/2604638100\""
            buildConfigField "String", "ADMOB_REWARDED_ID", "\"ca-app-pub-3940256099942544/5224354917\""

            debuggable false

            // ================================================================
            // CODE SHRINKING & OBFUSCATION
            // ================================================================
            minifyEnabled true              // Bật R8 để shrink code
            shrinkResources true            // Xóa resources không dùng (giảm ~10-20%)

            // Sử dụng proguard-android-optimize.txt để có optimization tốt hơn
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            signingConfig signingConfigs.release

            // ================================================================
            // NDK & NATIVE LIBS OPTIMIZATION
            // ================================================================
            ndk {
                // Loại bỏ debug symbols trong native libs (giảm ~20-30%)
                debugSymbolLevel 'NONE'
            }
        }

        debug {
            buildConfigField "Boolean", "IS_ENABLE_ADMOB", "false"
            // AppLovin SDK Key injected via manifestPlaceholders (không hardcode trong Manifest)
            manifestPlaceholders = [APPLOVIN_SDK_KEY: "e75FnQfS9XTTqM1Kne69U7PW_MBgAnGQTFvtwVVui6kRPKs5L7ws9twr5IQWwVfzPKZ5pF2IfDa7lguMgGlCyt"]
            buildConfigField "String", "PRIVACY_POLICY_URL", "\"https://loitp.notion.site/Term-Privacy-Policy-Disclaimer-319b1cd8783942fa8923d2a3c9bce60f\""

            // Use real AppLovin IDs for debug or place test logic if AppLovin requires it. AppLovin test mode can be enabled via code.
            buildConfigField "String", "APPLOVIN_BANNER_ID", "\"aa291bda0fb0b6c5\""
            buildConfigField "String", "APPLOVIN_INTERSTITIAL_ID", "\"7cf8ffccbdb242be\""
            buildConfigField "String", "APPLOVIN_APP_OPEN_ID", "\"d4acd020c861e87a\""
            buildConfigField "String", "APPLOVIN_REWARDED_ID", "\"6a333043c24bd06e\""

            // Debug config - sử dụng AdMob test IDs
            buildConfigField "String", "ADMOB_BANNER_ID", "\"ca-app-pub-3940256099942544/6300978111\""
            buildConfigField "String", "ADMOB_INTERSTITIAL_ID", "\"ca-app-pub-3940256099942544/1033173712\""
            buildConfigField "String", "ADMOB_APP_OPEN_ID", "\"ca-app-pub-3940256099942544/9257395921\""
            buildConfigField "String", "ADMOB_REWARDED_ID", "\"ca-app-pub-3940256099942544/5224354917\""

            // Có thể bật minify cho debug build để test
            // nhưng nên tắt để build nhanh hơn khi develop
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    // ========================================================================
    // PRODUCT FLAVORS (Dev vs Production)
    // ========================================================================
    flavorDimensions.add("type")

    productFlavors {
        dev {
            dimension "type"
            buildConfigField "String", "FLAVOR_buildEnv", '"dev"'
            resValue "string", "app_name", "Fisheye Launcher DEV"
        }

        production {
            dimension "type"
            buildConfigField "String", "FLAVOR_buildEnv", '"prod"'
            resValue "string", "app_name", "Fisheye Launcher"
        }
    }

    // ========================================================================
    // APK SPLITS - Tạo APK riêng cho từng cấu hình
    // ========================================================================
    // CHÚ Ý: Phải comment out splits khi build AAB (Android App Bundle)
    // AAB tự động xử lý splitting. Chỉ bật splits khi build APK thông thường.

    // Để bật: uncomment block splits bên dưới
    // Để tắt (cho AAB): comment out hoặc set enable = false

//    splits {
//        // Split theo ABI (CPU architecture) - giảm ~40-60% size mỗi APK
//        abi {
//            enable true
//            reset()
//            include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
//            universalApk false  // Không tạo universal APK (chứa tất cả ABIs)
//        }
//
//        // Split theo density (màn hình) - DEPRECATED, không nên dùng
//        // AAB tự động xử lý density splitting tốt hơn
//        density {
//            enable false
//        }
//    }

    // ========================================================================
    // BUILD FEATURES
    // ========================================================================
    buildFeatures {
        buildConfig = true  // Enable BuildConfig generation

        // Tắt các feature không dùng để giảm overhead
        aidl = false
        renderScript = false
        shaders = false

        viewBinding true // Bật khi cần sử dụng View Binding
    }

    // ========================================================================
    // COMPILE OPTIONS
    // ========================================================================
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'

        // Tối ưu Kotlin compilation
        freeCompilerArgs += [
            '-Xjvm-default=all',  // Generate default methods trong interfaces
            '-opt-in=kotlin.RequiresOptIn'  // Opt-in cho experimental APIs
        ]
    }

    // ========================================================================
    // PACKAGING OPTIONS - Loại bỏ files không cần thiết
    // ========================================================================
    packagingOptions {
        // Loại bỏ các file META-INF không cần thiết (giảm ~1-2 MB)
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/license.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/notice.txt',
                'META-INF/ASL2.0',
                'META-INF/*.kotlin_module',
                'META-INF/AL2.0',
                'META-INF/LGPL2.1',
                'META-INF/versions/9/previous-compilation-data.bin',
                'kotlin/**',
                'DebugProbesKt.bin'
            ]
        }

        // Loại bỏ debug info trong native libs
        jniLibs {
            useLegacyPackaging = false
            // Chỉ pick file .so đầu tiên nếu bị duplicate
            pickFirsts += ['**/*.so']
        }

        // Giảm kích thước dex files
        dex {
            useLegacyPackaging = false
        }
    }

    // ========================================================================
    // OUTPUT FILE NAME CUSTOMIZATION
    // ========================================================================
    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            // Format: com.mckimquyen.lenslauncher[buildType]_[version]_[versionCode].apk
            // VD: com.mckimquyen.launcherrelease_2025.10.07_20251007.apk
            def fileName = "${defaultConfig.applicationId}${buildType.name}_${defaultConfig.versionName}_${defaultConfig.versionCode}"

            // Nếu có split, thêm thông tin split vào tên file
            def abiFilter = output.getFilter('ABI')
            def densityFilter = output.getFilter('DENSITY')
            if (abiFilter != null) {
                fileName += "_${abiFilter}"
            }
            if (densityFilter != null) {
                fileName += "_${densityFilter}"
            }

            outputFileName = "${fileName}.apk"
        }
    }

    // ========================================================================
    // BUNDLE (AAB) CONFIGURATION
    // ========================================================================
    bundle {
        // Ngôn ngữ: AAB sẽ tự động split theo ngôn ngữ
        language {
            enableSplit = true
        }

        // Density: AAB sẽ tự động split theo màn hình
        density {
            enableSplit = true
        }

        // ABI: AAB sẽ tự động split theo kiến trúc CPU
        abi {
            enableSplit = true
        }
    }
}

// ============================================================================
// DEPENDENCIES
// ============================================================================
dependencies {
    // Local JARs
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // ========================================================================
    // TESTING DEPENDENCIES
    // ========================================================================

    // Unit Testing (JVM-based tests)
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlin:kotlin-test:2.0.20'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'  // LiveData testing
    testImplementation 'org.mockito:mockito-core:5.8.0'         // Mocking framework
    testImplementation 'org.mockito.kotlin:mockito-kotlin:5.2.1'
    testImplementation 'org.robolectric:robolectric:4.11.1'    // Android unit tests

    // Android Instrumentation Testing (Device/Emulator-based tests)
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.1'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test:core-ktx:1.6.1'               // ActivityScenario KTX
    androidTestImplementation 'androidx.fragment:fragment-testing:1.8.6'    // launchFragmentInContainer (FrmLensWidgetTest)
    debugImplementation 'androidx.fragment:fragment-testing:1.8.6'          // Required for launchFragmentInContainer
    androidTestImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0'

    // ========================================================================
    // ANDROID UI COMPONENTS
    // ========================================================================
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.palette:palette-ktx:1.0.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.webkit:webkit:1.14.0'

    // Material Dialogs - giữ version cũ vì version mới có breaking changes
    implementation 'com.afollestad.material-dialogs:core:0.9.6.0'
    implementation 'com.afollestad.material-dialogs:commons:0.9.6.0'

    // ========================================================================
    // ARCHITECTURE COMPONENTS
    // ========================================================================
    // AndroidX Lifecycle - LiveData & ViewModel
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-process:2.8.7'  // ProcessLifecycleOwner

    // ========================================================================
    // KOTLIN COROUTINES
    // ========================================================================
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0'

    // ========================================================================
    // DATABASE
    // ========================================================================
    // Room Database
    implementation 'androidx.room:room-runtime:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'

    // ========================================================================
    // SECURITY
    // ========================================================================
    // Biometric Authentication
    // https://github.com/SimformSolutionsPvtLtd/SSBiometricsAuthentication
    implementation 'androidx.biometric:biometric:1.2.0-alpha05'

    // ========================================================================
    // MONETIZATION - ADMOB WRAPPER
    // ========================================================================
    implementation 'com.github.royt93:AdmobApplovinWrapper:1.1.5'

    // ========================================================================
    // GOOGLE PLAY SERVICES
    // ========================================================================
    // In-App Review
    implementation 'com.google.android.play:review:2.0.2'
    implementation 'com.google.android.play:review-ktx:2.0.2'

    // ========================================================================
    // FIREBASE (commented out - bật khi cần)
    // ========================================================================
    // api platform('com.google.firebase:firebase-bom:33.2.0')
    // api 'com.google.firebase:firebase-analytics-ktx'
    // api 'com.google.firebase:firebase-crashlytics-ktx'
    // api 'com.google.firebase:firebase-config-ktx'

    // ========================================================================
    // DEBUG TOOLS (commented out - bật khi cần debug)
    // ========================================================================
    // Memory leak detection - chỉ chạy trong debug builds
    // debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.14'
}
